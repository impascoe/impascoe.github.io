[project]
site_name = "Isaac Pascoe"
site_url = "https://impascoe.github.io/"
site_description = "Portfolio and technical project reports by Isaac Pascoe."
site_author = "Isaac Pascoe"
repo_name = "impascoe"
repo_url = "https://github.com/impascoe/"
extra_css = ["stylesheets/portfolio.css"]
nav = [
  { "Home" = "index.md" },
  { "About" = "about.md" },
  { "Projects" = [
    "projects/index.md",
    { "The Growth Exponent" = "projects/the-growth-exponent.md" },
    { "ZipChip" = "projects/zipchip.md" },
    { "Zirconium" = "projects/zirconium.md" },
    { "pashion" = "projects/pashion.md" },
    { "Scholarly Searcher" = "projects/scholarly-search.md" },
    { "WeatherWise CLI" = "projects/weatherwise.md" },
    { "sudoku-solver" = "projects/sudoku-solver.md" },
    { "Client web applications" = "projects/client-web-applications.md" },
    { "Smash Return" = "projects/smash-return.md" },
    { "ZMM 2.0" = "projects/zmm-2.md" },
    { "Dotfiles" = "projects/dotfiles.md" },
  ] },
  { "Contact" = "contact.md" },
  { "GitHub" = "https://github.com/impascoe" },
  { "Pascalax" = "https://www.pascalax.com/" },
]
copyright = """
  &copy; 2025 Isaac Pascoe ·
  <a href=\"#__consent\">Change cookie settings</a>
"""

[project.theme]
variant = "classic"
logo = "assets/logo-black.svg"
favicon = "assets/logo-black.svg"
features = [
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.tabs",
  "navigation.sections",
  "navigation.indexes",
  "navigation.top",
]

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.theme.font]
text = "Roboto"
code = "Roboto Mono"

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.extra.consent]
title = "Cookie consent"
description = """
  We use cookies to recognize your repeated visits and preferences, as well
  as to measure the effectiveness of our documentation and whether users
  find what they're searching for. With your consent, you're helping us to
  make our documentation better.
"""

[project.extra.analytics]
provider = "google"
property = "G-X5KFVDGFG2"
